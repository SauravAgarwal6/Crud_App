<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/createEmployee.css">
    <link rel="shortcut icon" href="../Assets/favicon.png" type="image/x-icon">
    <title>Create Employee</title>
</head>
<body>

    <nav class="navbar-container">
        <figure class="logo">
           <a href="/index.html">CRUD-APP</a> 
        </figure>

        <div class="nav-links">
            <a href="/Pages/createEmployee.html">Create Employee</a>
            <a href="/Pages/allEmployee.html">All Employees</a>
        </div>
     </nav>

    <div class="form-container">
        <form id="employeeForm">

            <div class="form-top">
                <div class="form-logo">
                    <div class="circle-logo">KING</div>
                </div>

                <div class="form-heading">
                    <h2>Employee Registration Form</h2>
                    <p>
                        Please fill out the form for HR department to complete your registration.
                        An HR manager will contact you with further instructions.
                    </p>
                </div>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <div class="three-inputs">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="middleName" placeholder="Middle Name">
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>Marital Status</label>
                    <select id="maritalStatus">
                        <option value="">Select</option>
                        <option>Single</option>
                        <option>Married</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="E-mail" required>
                </div>

                <div class="form-group">
                    <label>Mobile Number *</label>
                    <input type="text" id="mobile" placeholder="Mobile Number" required>
                </div>
            </div>

            <div class="form-group">
                <label>Home Address</label>
                <input type="text" id="street" placeholder="Street Address">
            </div>

            <div class="two-columns">
                <input type="text" id="city" placeholder="City">
                <input type="text" id="state" placeholder="State / Province">
            </div>

            <div class="two-columns">
                <input type="text" id="country" placeholder="Country">
                <input type="text" id="zip" placeholder="ZIP Code">
            </div>

            <button type="submit" class="submit-btn">REGISTER ME</button>

        </form>
    </div>

    <script src="../js/creEmplyee.js"></script>
</body>
</html>
